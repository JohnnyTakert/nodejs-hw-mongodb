description: 'Not found'
content:
  application/json:
    schema:
      type: object
      required:
        - status
        - message
        - data
      properties:
        status:
          type: integer
          example: 404
        message:
          type: string
          example: NotFoundError
        data:
          type: object
          properties:
            message:
              description: Error message
              type: string
              example: 'Not found'
